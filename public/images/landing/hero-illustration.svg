<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<title>Ilustrasi dua petugas K3 meninjau tablet di area produksi</title>
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a4343"/><stop offset="1" stop-color="#163b3b"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#295757"/><stop offset="1" stop-color="#163636"/></linearGradient>
 <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efc4" stop-opacity=".32"/><stop offset="1" stop-color="#f3efc4" stop-opacity="0"/></linearGradient>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d794"/><stop offset="1" stop-color="#99d5d5"/></linearGradient>
 <radialGradient id="glow"><stop offset="0" stop-color="#ffc83d" stop-opacity=".55"/><stop offset="1" stop-color="#ffc83d" stop-opacity="0"/></radialGradient>
 <linearGradient id="walk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6c6c"/><stop offset="1" stop-color="#2c5b5b"/></linearGradient>
</defs>
<style>
 .breathe{animation:breathe 4.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
 .breathe.b2{animation-delay:-2.1s}
 .blink{animation:blink 2.4s steps(1) infinite}.blink.d2{animation-delay:-.8s}.blink.d3{animation-delay:-1.6s}
 .belt{stroke-dasharray:14 22;animation:belt 1.6s linear infinite}
 .rays{animation:rays 7s ease-in-out infinite}
 .glow{animation:glow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .dust circle{animation:dust 9s linear infinite}.dust circle:nth-child(2){animation-delay:-3s}.dust circle:nth-child(3){animation-delay:-6s}.dust circle:nth-child(4){animation-delay:-1.5s}.dust circle:nth-child(5){animation-delay:-4.5s}
 .roll{animation:roll 6s linear infinite;transform-box:fill-box;transform-origin:center}
 .wave{animation:wave 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
 .screen-bar{animation:bar 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.screen-bar.s2{animation-delay:-1s}.screen-bar.s3{animation-delay:-2s}
 @keyframes breathe{50%{transform:translateY(-4px)}}
 @keyframes blink{0%{opacity:1}50%{opacity:.25}}
 @keyframes belt{to{stroke-dashoffset:-36}}
 @keyframes rays{50%{opacity:.55}}
 @keyframes glow{50%{transform:scale(1.15);opacity:.7}}
 @keyframes dust{0%{transform:translate(0,0);opacity:0}15%{opacity:.8}100%{transform:translate(-60px,-260px);opacity:0}}
 @keyframes roll{to{transform:rotate(360deg)}}
 @keyframes wave{50%{transform:rotate(-7deg)}}
 @keyframes bar{50%{transform:scaleY(.65)}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<!-- wall & roof -->
<rect width="1600" height="900" fill="url(#wall)"/>
