<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1000" preserveAspectRatio="xMidYMid slice">
<title>Ilustrasi petugas memindai QR pada kotak P3K dengan ponsel</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d5b5b"/><stop offset="1" stop-color="#1c4242"/></linearGradient>
 <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#ffc83d" stop-opacity=".55"/><stop offset="1" stop-color="#ffc83d" stop-opacity=".05"/></linearGradient>
</defs>
<style>
 .float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.float.f2{animation-delay:-1.7s}.float.f3{animation-delay:-3.2s}
 .beam{animation:beam 2.2s ease-in-out infinite}
 .line{animation:line 2.2s ease-in-out infinite}
 .phone{animation:phone 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
 @keyframes float{50%{transform:translateY(-14px)}}
 @keyframes beam{50%{opacity:.45}}
 @keyframes line{0%,100%{transform:translateY(0)}50%{transform:translateY(150px)}}
 @keyframes phone{50%{transform:rotate(-2deg) translateY(-6px)}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1450" height="1000" fill="url(#bg)"/>
<g fill="#ffffff" opacity=".05"><circle cx="1180" cy="200" r="260"/><circle cx="260" cy="860" r="200"/></g>
<g stroke="#3d7373" stroke-width="3" opacity=".6"><path d="M0 720h1450"/></g>

<!-- P3K box -->
<g>
 <rect x="160" y="250" width="520" height="440" rx="26" fill="#f4f1e4"/>
 <rect x="160" y="250" width="520" height="70" rx="26" fill="#e3decb"/>
 <rect x="390" y="232" width="60" height="30" rx="8" fill="#c9c2a9"/>
 <rect x="200" y="360" width="190" height="190" rx="18" fill="#2c9e9e"/>
 <path d="M272 390h46v46h46v46h-46v46h-46v-46h-46v-46h46z" fill="#fff"/>
 <text x="295" y="610" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700" fill="#2b6161" text-anchor="middle">P3K</text>
 <!-- QR sticker -->
 <rect x="440" y="360" width="200" height="200" rx="14" fill="#fff" stroke="#cbdcdc" stroke-width="4"/>
 <g fill="#142929">
  <rect x="460" y="380" width="50" height="50" rx="6"/><rect x="570" y="380" width="50" height="50" rx="6"/><rect x="460" y="490" width="50" height="50" rx="6"/>
  <rect x="470" y="390" width="30" height="30" rx="3" fill="#fff"/><rect x="580" y="390" width="30" height="30" rx="3" fill="#fff"/><rect x="470" y="500" width="30" height="30" rx="3" fill="#fff"/>
  <rect x="478" y="398" width="14" height="14"/><rect x="588" y="398" width="14" height="14"/><rect x="478" y="508" width="14" height="14"/>
  <rect x="525" y="380" width="14" height="14"/><rect x="543" y="398" width="14" height="14"/><rect x="525" y="416" width="14" height="14"/>
  <rect x="525" y="445" width="14" height="14"/><rect x="543" y="463" width="14" height="14"/><rect x="561" y="445" width="14" height="14"/><rect x="590" y="445" width="14" height="14"/><rect x="606" y="463" width="14" height="14"/>
  <rect x="460" y="445" width="14" height="14"/><rect x="490" y="463" width="14" height="14"/>
  <rect x="525" y="490" width="14" height="14"/><rect x="543" y="508" width="14" height="14"/><rect x="570" y="490" width="14" height="14"/><rect x="588" y="508" width="14" height="14"/><rect x="606" y="526" width="14" height="14"/><rect x="525" y="526" width="14" height="14"/><rect x="570" y="526" width="14" height="14"/>
 </g>
 <g class="line"><rect x="446" y="372" width="188" height="6" rx="3" fill="#2c9e9e" opacity=".8"/></g>
 <rect x="200" y="630" width="440" height="14" rx="7" fill="#e3decb"/>
</g>

<!-- scan beam -->
<path class="beam" d="M640 360L960 470v170L640 560z" fill="url(#beam)"/>

<!-- hand + phone -->
<g class="phone">
 <path d="M1300 1000c-40-120-90-210-170-260l-60 60c50 60 80 130 90 200z" fill="#2b6161"/>
 <rect x="940" y="380" width="200" height="370" rx="32" fill="#142929"/>
 <rect x="954" y="398" width="172" height="334" rx="22" fill="#f9dd91"/>
 <rect x="1010" y="406" width="60" height="10" rx="5" fill="#142929"/>
 <rect x="976" y="440" width="128" height="112" rx="10" fill="#fff"/>
 <circle cx="1040" cy="496" r="34" fill="#2c9e9e"/>
 <path d="M1024 496l11 11 22-24" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <rect x="976" y="572" width="96" height="12" rx="6" fill="#2b6161"/>
 <rect x="976" y="596" width="128" height="10" rx="5" fill="#89c5c5"/>
 <rect x="976" y="616" width="110" height="10" rx="5" fill="#89c5c5"/>
 <rect x="976" y="660" width="128" height="40" rx="20" fill="#ffc83d"/>
 <rect x="1004" y="676" width="72" height="8" rx="4" fill="#2b6161"/>
 <path d="M1150 560c40 10 60 50 50 100l-30 120c-10 40-50 70-100 60l-40-8c-30-6-40-30-30-50l16-30" fill="#c98b5f"/>
 <rect x="910" y="560" width="70" height="34" rx="17" fill="#c98b5f"/>
 <rect x="904" y="604" width="76" height="34" rx="17" fill="#c98b5f"/>
 <rect x="912" y="648" width="68" height="34" rx="17" fill="#c98b5f"/>
</g>

<!-- floating info chips -->
<g class="float"><rect x="980" y="200" width="300" height="96" rx="22" fill="#f4f1e4"/><circle cx="1030" cy="248" r="24" fill="#ffc83d"/><path d="M1020 248h20M1030 238v20" stroke="#2b6161" stroke-width="6" stroke-linecap="round"/><rect x="1068" y="228" width="160" height="14" rx="7" fill="#2b6161"/><rect x="1068" y="254" width="110" height="12" rx="6" fill="#9ab6b6"/></g>
<g class="float f2"><rect x="1150" y="800" width="230" height="84" rx="20" fill="#ffc83d"/><circle cx="1194" cy="842" r="20" fill="#2b6161"/><path d="M1185 842l7 7 12-14" stroke="#ffc83d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="1226" y="832" width="120" height="12" rx="6" fill="#2b6161"/></g>
<g class="float f3"><circle cx="120" cy="150" r="16" fill="#ffc83d" opacity=".7"/><circle cx="760" cy="150" r="10" fill="#f4f1e4" opacity=".6"/><circle cx="820" cy="840" r="12" fill="#ffc83d" opacity=".5"/></g>
</svg>
